version: '3.8'

services:
  calculator:
    build:
      context: ./calculator
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    networks:
      - bank-network

  deal:
    build:
      context: ./deal
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    networks:
      - bank-network

  statement:
    build:
      context: ./statement
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    networks:
      - bank-network

  dossier:
    build:
      context: ./dossier
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    networks:
      - bank-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - bank-network

  zookeeper:
    image: wurstmeister/zookeeper:3.4.6
    ports:
      - "2181:2181"
    networks:
      - bank-network

  kafka:
    image: wurstmeister/kafka:2.12-2.1.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    networks:
      - bank-network

networks:
  bank-network:
    driver: bridge
