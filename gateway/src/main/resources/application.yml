server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: employeeModule
          uri: http://localhost:8081/
          predicates:
            - Path=/employee/**
        - id: consumerModule
          uri: http://localhost:8082/
          predicates:
            - Path=/consumer/**

feign:
  hystrix:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    swagger-url:
      path: /swagger-ui.html
